services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: buffet_chay
      DB_USER: buffet_user
      DB_PASS: buffet_pass
      DB_CHARSET: utf8
      BASE_URL: ${BASE_URL:-http://localhost:8080/buffet-chay}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080/buffet-chay}
      VIETQR_ENABLED: ${VIETQR_ENABLED:-0}
      VIETQR_BANK_ID: ${VIETQR_BANK_ID:-}
      VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:-}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-}
      VIETQR_TEMPLATE: ${VIETQR_TEMPLATE:-compact2}
      MONGO_ENABLED: ${MONGO_ENABLED:-1}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-buffet_chay_analytics}
    volumes:
      - ./:/var/www/html/buffet-chay
    depends_on:
      - db
      - mongo

  db:
    image: mariadb:10.5
    environment:
      MYSQL_DATABASE: buffet_chay
      MYSQL_USER: buffet_user
      MYSQL_PASSWORD: buffet_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: buffet_user
      PMA_PASSWORD: buffet_pass
    depends_on:
      - db

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  db_data:
  mongo_data:
